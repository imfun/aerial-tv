name: Sync Releases and APKs

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动检查一次
  workflow_dispatch: # 允许手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限

    steps:
      - name: Sync GitHub Releases
        uses: aeon-w/fork-sync@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: "pengchujin"
          repo: "aerial-tv"
